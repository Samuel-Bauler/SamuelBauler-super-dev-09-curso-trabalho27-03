<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/formulario.css">
</head>
<body>
     <form action="Home.html">
        <div class="login-box">
        <h2>Bem-vindo!</h2>
    
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Nome:">
    
        <label for="idade">Idade</label>
        <input type="number" id="idade" name="idade" placeholder="Idade" min="0" max="100">
    
        <label for="nascimento">Data de nascimento</label>  
        <input type="date" id="nascimento" name="nascimento" placeholder="Data de Nascimento">

        <div class="campo">
            <label>Interesses</label>
                <div class="opcoes">
                <label><input type="checkbox" id="musica" name="interesses" value="musica"> Música</label>
                <label><input type="checkbox" id="esportes" name="interesses" value="esportes"> Esportes</label>
                <label><input type="checkbox" id="tecnologia" name="interesses" value="tecnologia"> Tecnologia</label>
            </div>
         </div>
    <div>
        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem" rows="4" placeholder="Escreva sua mensagem aqui..."></textarea>
    </div>
        


        <button id="submit">Entrar</button>

        </div>
    </div>
  </form>
</body>
</html>
