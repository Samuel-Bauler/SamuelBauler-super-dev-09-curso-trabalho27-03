<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/formulario.css">
</head>
<body>
     <form action="Enviado.html">
        <div class="formulario-box">
            <h2>Bem-vindo!</h2>
        
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" placeholder="Nome:" required>
        
            <label for="idade">Idade</label>
            <input type="number" id="idade" name="idade" placeholder="Idade" min="10" max="100" required>
        
            <label for="nascimento">Data de nascimento</label>  
            <input type="date" id="nascimento" name="nascimento" placeholder="Data de Nascimento" min="1970-12-31" max="2025-12-31" required>

            <p>Qual estilo você mais gosta:</p>

            <div class="estilo">
                <select name="like" id="like" required >
                    <option value="hard-rock">Hard Rock</option>
                    <option value="Heavy-metal">Heavy metal</option>
                    <option value="Blues-rock">Blues Rock</option>
                </select>
            </div>

            <p>Quais membros você mais curte?</p>

            <div class="checkbox" aria-relevant="">
                <input type="checkbox" name="gosto" id="gosto">
                <label for="gosto">Axl Rose</label>

                <input type="checkbox" name="gosto" id="gosto">
                <label for="gosto">Slash</label>
            </div>
            <div class="checkbox2">
                <input type="checkbox" name="gosto" id="gosto">
                <label for="gosto">Duff McKagan</label>

                <input type="checkbox" name="gosto" id="gosto">
                <label for="gosto">Izzy Stradlin</label>
            </div>
            
            
            
                

            <button id="submit">Entrar</button>

        </div>
    </div>
  </form>
</body>
</html>
