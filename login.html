
<!DOCTYPE html>
<html lang="pt-br">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/login.css ">
<title>Login</title>
</head>
<body>

  <form action="Home.html">
    <div class="login-box">
      <h2>Bem-vindo!</h2>

        <div class="esquici-senha">

            Esqueci minha senha
          </a>
        </div>
    </div>
  </form>
  

</body>
</html>
