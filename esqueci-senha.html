<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Esqueci a Senha</title>
    <link rel="stylesheet" href="assets/css/esqueci-senha.css">
</head>
<body>

<div class="box">
    <h2>Recuperar Senha</h2>

    <form action="login.html" method="post">

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf"  placeholder="Apenas números" required>

  
        <label for="senha">Nova senha</label>
        <input type="password" id="senha" name="senha" required min="6">

        <label for="confirmar">Confirmar senha</label>
        <input type="password" id="confirmar" name="confirmar" required min="6">

        <button type="submit">
            <a href="login.html">
                Alterar Senha
            </a>
        </button>

    </form>
</div>

</body>
</html>
