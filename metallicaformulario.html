<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fã de metallica</title>
    <link rel="stylesheet" href="assets/css/metallicaformulario.css">
</head>
<body>
    <div>
        <form>
            <h2>Formulário - Fã do Metallica</h2>
            <div>
                <label for="nome">Seu nome:</label>
                <input type="text" id="nome" name="nome">
            </div>
            <div>
                <label for="idade">Sua idade:</label>
                <input type="number" id="idade" name="idade">
            </div>
            <div>
                <label for="primeiro-show">Data do primeiro show do Metallica que você viu:</label>
                <input type="date" id="primeiro-show" name="primeiro-show">
            </div>
            <div>
                <label for="musica-favorita">Qual sua música favorita do Metallica?</label>
                <textarea id="musica-favorita" name="musica-favorita"></textarea>
            </div>
            <div>
                <p>Banda favorita dentro do Metal:</p>
        
                <input type="radio" id="metallica" name="banda" value="metallica">
                <label for="metallica">Metallica</label>
        
                <input type="radio" id="iron" name="banda" value="iron-maiden">
                <label for="iron">Iron Maiden</label>
        
                <input type="radio" id="slayer" name="banda" value="slayer">
                <label for="slayer">Slayer</label>
            </div>
            <div>
                <p>Álbuns que você curte:</p>
        
                <input type="checkbox" id="black-album" name="albuns" value="black-album">
                <label for="black-album">Black Album</label>
        
                <input type="checkbox" id="master" name="albuns" value="master-of-puppets">
                <label for="master">Master of Puppets</label>
        
                <input type="checkbox" id="ride" name="albuns" value="ride-the-lightning">
                <label for="ride">Ride the Lightning</label>
            </div>
            <div>
                <label for="era">Era favorita da banda:</label>
                <select id="era" name="era">
                    <option value="">Selecione</option>
                    <option value="80s">Anos 80</option>
                    <option value="90s">Anos 90</option>
                    <option value="2000+">2000 em diante</option>
                </select>
            </div>
            <div>
                <button type="submit">Enviar</button>
            </div>
        </form>
    </div>
</body>
</html>
