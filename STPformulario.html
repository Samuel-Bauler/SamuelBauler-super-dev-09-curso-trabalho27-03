<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="assets/css/STPformulario.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Stone Temple Pilots</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
<form action="enviadostp.html" method="get">
    <div id="caixaform" class="divnabox">
    <div class="divnabox">
        <span class="divnabox">
        <h1>Formulário</h1>
    <label for="nome" class="tituloform">Nome:</label>
    <input type="text" id="nome" name="nome" class="caixaselect" placeholder="Digite seu nome" required>
    </div>
    <div class="divnabox">
    <label for="idade" class="tituloform">Idade:</label>
    <input type="number" id="idade" class="caixaselect" placeholder="Digite sua idade" required>
    </div>
    <div class="divnabox">
     <label for="data" class="tituloform">Data de nascimento:</label>
    <input type="date" id="data" min="1" max="200" class="caixaselect" required>
    </div>
    <div class="divnabox">
    <label for="estilomusical" class="tituloform">Qual estilo musical você mais gosta?</label>
        <select class="caixaselect" required>
        <option value="" disabled selected>Selecione um estilo musical</option>   
        <option value="Grunge">Grunge</option>
        <option value="Metal">Heavy metal</option>
        <option value="classic">Classic rock</option>
        <option value="Punk">Punk rock</option>
        </select>
    </div>
    <div>
        <p><div>Já escutou algumas dessas músicas?</div> Quais você mais gosta:</p>
        <div id="areacheckbox">
        <span class="boxemlinha">

        
        <label for="cb1" class="nomebox" value="Interstate Love Song"><input type="checkbox" id="cb1" class="checkmsc">Interstate Love Song</label>
        

        
        <label for="cb2" class="nomebox" value="Creep"><input type="checkbox" id="cb2" class="checkmsc">Creep</label>

        
        <label for="cb3" class="nomebox" value="Plush"><input type="checkbox" id="cb3" class="checkmsc">Plush</label>

        
        <label for="cb4" class="nomebox" id="stt" value="Sex type thing"><input type="checkbox" id="cb4" class="checkmsc">Sex type thing</label>

    </div>
</div>
    <div id="botao">
    <a href="enviadostp.html">
    <button type="submit" name="enviar" value="Enviar">Enviar</button>
    </a>
    </div> 
</div>
</span>
</form>
</body>
</html>
